# Read-only PR/main gate on Node 22. Locked installation precedes all lint/type/test/build/HTTP checks; dependency audits fail on moderate-or-higher advisories.
name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit full dependency tree
        run: npm audit --audit-level=moderate
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run repository quality gate
        run: npm run check
      - name: Install Chromium for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Verify static documents and Vue islands in Chromium
        run: npm run verify:browser

      - name: Install deterministic screenshot fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Verify accessibility, resilience and composition snapshots in Chromium
        run: npm run verify:experience
      - name: Install Firefox on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps firefox
      - name: Verify Firefox behavior and accessibility on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright test --project=firefox
      - name: Attach browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore

  production-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Reserved test origin exercises generated metadata; this artifact is never deployed.
      NARI_DEPLOY_CONTEXT: production
      NARI_SITE_ORIGIN: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  refinement-review:
    # Compare both artifacts on the same machine; these screenshots never update accepted baselines.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Install matching composition fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Build candidate for review
        run: npm run build
      - name: Capture candidate production typography and network
        env:
          NARI_REVIEW_LABEL: candidate
          NARI_REVIEW_INLINE: '1'
        run: npx playwright test --project=chromium --grep "review evidence:" --output=review-candidate
      - name: Check out PR base for equivalent comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: review-base-source
      - name: Build PR base
        working-directory: review-base-source
        run: npm ci && npm run build
      - name: Capture base production typography and network
        env:
          NARI_REVIEW_LABEL: base
          NARI_REVIEW_INLINE: '1'
          NARI_PREVIEW_ROOT: review-base-source/dist
        run: npx playwright test --project=chromium --grep "review evidence:" --output=review-base
      - name: Verify Firefox behavior and accessibility on the candidate
        run: npx playwright test --project=firefox
      - name: Attach base and candidate review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-refinement-review
          path: |
            review-base/
            review-candidate/
          if-no-files-found: ignore
