# Read-only PR/main gate on Node 22. Locked installation precedes all lint/type/test/build/HTTP checks; audit reporting remains separate.
name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository quality gate
        run: npm run check
      - name: Install Chromium for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Verify static documents and Vue islands in Chromium
        run: npm run verify:browser
